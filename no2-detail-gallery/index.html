</style></head><body><header><small>草原津典 / NO.2 甄选礼盒</small><h1>九屏详情页</h1><p>奶油底色 · 墨绿文字 · 草原本味</p><div class="bar"><p>点击图片放大，支持原尺寸查看。</p><div class="tabs"><button class="active" id="grid" aria-pressed="true">九屏总览</button><button id="long" aria-pressed="false">连续浏览</button></div></div></header><main id="gallery"><button class="card" data-i="0" aria-label="放大查看 把草原本味带上餐桌"><img src="images/01.webp" alt="把草原本味带上餐桌" width="1086" height="1448" loading="eager"><span><b>01</b>把草原本味带上餐桌</span></button><button class="card" data-i="1" aria-label="放大查看 好风味有来处"><img src="images/02.webp" alt="好风味有来处" width="1086" height="1448" loading="eager"><span><b>02</b>好风味有来处</span></button><button class="card" data-i="2" aria-label="放大查看 细嫩浓香尝一口本味"><img src="images/03.webp" alt="细嫩浓香尝一口本味" width="1086" height="1448" loading="eager"><span><b>03</b>细嫩浓香尝一口本味</span></button><button class="card" data-i="3" aria-label="放大查看 六个部位一盒尽享"><img src="images/04.webp" alt="六个部位一盒尽享" width="1086" height="1448" loading="lazy"><span><b>04</b>六个部位一盒尽享</span></button><button class="card" data-i="4" aria-label="放大查看 好食材认真处理"><img src="images/05.webp" alt="好食材认真处理" width="1086" height="1448" loading="lazy"><span><b>05</b>好食材认真处理</span></button><button class="card" data-i="5" aria-label="放大查看 一盒安排几顿好饭"><img src="images/06.webp" alt="一盒安排几顿好饭" width="1086" height="1448" loading="lazy"><span><b>06</b>一盒安排几顿好饭</span></button><button class="card" data-i="6" aria-label="放大查看 本味之外自选风味"><img src="images/07.webp" alt="本味之外自选风味" width="1086" height="1448" loading="lazy"><span><b>07</b>本味之外自选风味</span></button><button class="card" data-i="7" aria-label="放大查看 心意藏在开盒之间"><img src="images/08.webp" alt="心意藏在开盒之间" width="1086" height="1448" loading="lazy"><span><b>08</b>心意藏在开盒之间</span></button><button class="card" data-i="8" aria-label="放大查看 把相聚安排进日常"><img src="images/09.webp" alt="把相聚安排进日常" width="1086" height="1448" loading="lazy"><span><b>09</b>把相聚安排进日常</span></button></main><div class="note">草原津典 NO.2 甄选礼盒 · 九屏详情页</div><dia const items=[{"src": "images/01.webp", "name": "把草原本味带上餐桌", "number": "01"}, {"src": "images/02.webp", "name": "好风味有来处", "number": "02"}, {"src": "images/03.webp", "name": "细嫩浓香尝一口本味", "number": "03"}, {"src": "images/04.webp", "name": "六个部位一盒尽享", "number": "04"}, {"src": "images/05.webp", "name": "好食材认真处理", "number": "05"}, {"src": "images/06.webp", "name": "一盒安排几顿好饭", "number": "06"}, {"src": "images/07.webp", "name": "本味之外自选风味", "number": "07"}, {"src": "images/08.webp", "name": "心意藏在开盒之间", "number": "08"}, {"src": "images/09.webp", "name": "把相聚安排进日常", "number": "09"}];let index=0;const $=s=>document.querySelector(s);const viewer=$('#viewer'),stage=$('#stage');
function show(i){index=(i+items.length)%items.length;const v=items[index];$('#large').src=v.src;$('#large').alt=v.name;$('#counter').textContent=v.number+' / '+items.length+'　'+v.name;$('#original').href=v.src;stage.classList.remove('zoom');$('#zoom').textContent='原尺寸';stage.scrollTop=0;stage.scrollLeft=0}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{show(+c.dataset.i);viewer.showModal()});$('#close').onclick=()=>viewer.close();$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);function zoom(){const z=stage.classList.toggle('zoom');$('#zoom').textContent=z?'适应屏幕':'原尺寸'}$('#zoom').onclick=zoom;$('#large').onclick=zoom;document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});['grid','long'].forEach(id=>$('#'+id).onclick=()=>{$('#gallery').classList.toggle('long',id==='long');['grid','long'].forEach(s=>{$('#'+s).classList.toggle('active',s===id);$('#'+s).setAttribute('aria-pressed',s===id?'true':'false')})});
