<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#153d35">
  <meta name="description" content="草原津典电商实拍调色图集。查看并下载鲜肉产品图片。">
  <title>电商实拍调色图集｜草原津典</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1e3029;background:#f5f4ef}
    *{box-sizing:border-box}body{margin:0}a{color:inherit}button{font:inherit}
    .top{background:#153d35;color:#f5f1e8;padding:20px clamp(22px,5vw,80px);display:flex;justify-content:space-between;align-items:center;gap:16px}
    .brand{font-weight:700;letter-spacing:.13em;font-size:17px}.top small{color:#b9cbc2;font-size:12px;letter-spacing:.12em}
    .hero{background:#153d35;color:white;padding:64px clamp(22px,5vw,80px) 73px;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,420px);gap:50px;align-items:end}
    .eyebrow{color:#d2b477;font-size:13px;font-weight:700;letter-spacing:.2em}.hero h1{font-size:clamp(34px,4.7vw,68px);line-height:1.14;letter-spacing:.035em;margin:19px 0 24px;font-weight:600}
    .hero p{max-width:680px;color:#d2ded7;line-height:1.9;font-size:16px;margin:0}.stats{border-top:1px solid #54746b;padding-top:20px;display:flex;gap:32px;justify-content:space-between}
    .stats strong{display:block;font:500 30px Georgia,serif;color:#ead2a2}.stats span{display:block;color:#a9c0b5;font-size:12px;margin-top:5px}
    main{max-width:1560px;margin:auto;padding:42px clamp(18px,5vw,80px) 90px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
    .toolbar h2{font-size:24px;margin:0}.toolbar p{font-size:13px;color:#62756b;margin:7px 0 0}.filters{display:flex;gap:8px;flex-wrap:wrap}
    .filters button{border:1px solid #c8d0c8;border-radius:999px;padding:9px 17px;background:transparent;color:#39554a;cursor:pointer}
    .filters button[aria-pressed="true"],.filters button:hover{background:#153d35;color:#fff;border-color:#153d35}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.card{background:#fff;border:1px solid #e5e8e2;border-radius:13px;overflow:hidden;box-shadow:0 12px 35px rgba(30,54,41,.04)}
    .picture{aspect-ratio:3/2;background:#e8e9e5;display:block;width:100%;border:0;padding:0;cursor:zoom-in;overflow:hidden}.picture img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.picture:hover img{transform:scale(1.025)}
    .details{padding:18px 19px 19px}.row{display:flex;align-items:start;justify-content:space-between;gap:12px}.row h3{margin:0;font-size:19px;font-weight:600}.tag{font-size:11px;border:1px solid #dfc591;color:#916d32;border-radius:100px;padding:5px 9px;white-space:nowrap}
    .sub{font-size:13px;color:#6c7c72;margin:8px 0 15px}.meta{display:flex;justify-content:space-between;gap:10px;color:#758279;font-size:12px;border-top:1px solid #eef0eb;padding-top:14px}
    .actions{display:flex;gap:9px;margin-top:16px}.actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #153d35;border-radius:7px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
    .download{background:#153d35;color:white;flex:1}.open{color:#153d35;background:white}.download:hover{background:#256250}.open:hover{background:#edf3ee}
    footer{border-top:1px solid #dce2db;color:#65766b;padding:25px clamp(18px,5vw,80px);font-size:12px;line-height:1.8}
    dialog{border:0;padding:0;background:#172822;color:white;max-width:min(96vw,1600px);max-height:96vh;box-shadow:0 25px 80px #0008}dialog::backdrop{background:#0a1714df}.lightbox{display:flex;flex-direction:column;max-height:96vh}.lightbox-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 18px}.lightbox-header button{border:0;color:white;background:transparent;font-size:28px;cursor:pointer}.lightbox img{display:block;max-width:96vw;max-height:calc(96vh - 110px);object-fit:contain}.lightbox-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:13px}.lightbox-footer a{color:#ead2a2}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.stats{max-width:500px}}
    @media(max-width:650px){.top small{display:none}.hero{padding-top:48px;padding-bottom:51px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.stats{gap:20px}.stats strong{font-size:25px}.actions a{flex:1}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">草原津典</div><small>品牌视觉素材 · 电商实拍</small></header>
  <section class="hero">
    <div><div class="eyebrow">PHOTO LIBRARY / 2026.10.25</div><h1>鲜肉实拍<br>调色图集</h1><p>用于同事查看与下载的实拍图片。收录此前统一调色交付的 8 张主图，以及 6 张羊前腿、后腿肉包和羊脊骨细节特写；点击图片可放大查看，点击“下载原图”保存对应文件。</p></div>
    <div class="stats"><div><strong>14</strong><span>张图片</span></div><div><strong>3</strong><span>内容分类</span></div><div><strong>JPG</strong><span>可单张下载</span></div></div>
  </section>
  <main>
    <div class="toolbar"><div><h2>全部图片</h2><p>8 张统一主图与 6 张细节特写，全部为 4500×3000 调色成片。</p></div><nav class="filters" aria-label="筛选图片"><button data-filter="全部" aria-pressed="true">全部</button><button data-filter="鲜肉单品" aria-pressed="false">鲜肉单品</button><button data-filter="细节特写" aria-pressed="false">细节特写</button><button data-filter="初包装组合" aria-pressed="false">初包装组合</button></nav></div>
    <div class="grid" id="gallery"></div>
  </main>
  <footer>草原津典 · 素材分享。网页中的下载文件为此前统一调色交付的原成片，未再次压缩或改变尺寸。下载前可查看每张图的分辨率与文件大小。</footer>
  <dialog id="viewer"><div class="lightbox"><div class="lightbox-header"><span id="viewer-title"></span><button type="button" id="close" aria-label="关闭预览">×</button></div><img id="viewer-image" alt=""><div class="lightbox-footer"><span id="viewer-meta"></span><a id="viewer-download" download>下载原图 ↓</a></div></div></dialog>
  <script>
    const gallery=document.querySelector('#gallery'),viewer=document.querySelector('#viewer');let items=[];let active='全部';
    const size=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB';
    function render(){gallery.replaceChildren();items.filter(x=>active==='全部'||x.category===active).forEach(x=>{
      const card=document.createElement('article');card.className='card';
      const picture=document.createElement('button');picture.className='picture';picture.type='button';picture.setAttribute('aria-label','放大查看 '+x.name+' '+x.note);
      const image=document.createElement('img');image.src=x.thumb;image.alt=x.name+' '+x.note;image.loading='lazy';picture.append(image);picture.onclick=()=>openViewer(x);
      const details=document.createElement('div');details.className='details';details.innerHTML='<div class="row"><h3></h3><span class="tag"></span></div><p class="sub"></p><div class="meta"><span></span><span></span></div><div class="actions"><a class="download" download>下载原图 ↓</a><a class="open" target="_blank" rel="noopener">打开原图 ↗</a></div>';
      details.querySelector('h3').textContent=x.name;details.querySelector('.tag').textContent=x.note;details.querySelector('.sub').textContent=x.file;
      details.querySelectorAll('.meta span')[0].textContent=x.width+' × '+x.height;details.querySelectorAll('.meta span')[1].textContent=size(x.bytes);
      details.querySelector('.download').href=x.photo;details.querySelector('.open').href=x.photo;
      card.append(picture,details);gallery.append(card);
    });}
    function openViewer(x){document.querySelector('#viewer-title').textContent=x.name+' · '+x.note;document.querySelector('#viewer-image').src=x.thumb;document.querySelector('#viewer-image').alt=x.name+' '+x.note;document.querySelector('#viewer-meta').textContent=x.width+' × '+x.height+' · '+size(x.bytes);document.querySelector('#viewer-download').href=x.photo;viewer.showModal()}
    document.querySelector('#close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer)viewer.close()};
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));render()});
    fetch('gallery.json').then(r=>{if(!r.ok)throw Error('gallery');return r.json()}).then(data=>{items=data;render()}).catch(()=>{gallery.textContent='图片列表加载失败，请刷新页面重试。'});
  </script>
</body>
</html>
